<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Drop Shadow for Tactile Feel -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <filter id="handle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Solid Protractor Body with High-Contrast Border -->
    <path 
      d="M 50 200 
         A 150 150 0 0 1 350 200 
         L 280 200 
         A 80 80 0 0 0 120 200 
         Z" 
      fill="url(#body-grad)" 
      stroke="#1E293B" 
      stroke-width="4.5" 
      stroke-linejoin="round"
      filter="url(#card-shadow)" 
    />

    <!-- Tick Marks -->
    <g stroke="#334155" stroke-width="2.5" stroke-linecap="round">
      <!-- 0 / 180 Deg -->
      <line x1="58" y1="200" x2="74" y2="200" />
      <line x1="326" y1="200" x2="342" y2="200" />
      <!-- 30 Deg -->
      <line x1="323" y1="135" x2="334" y2="130" />
      <!-- 45 Deg -->
      <line x1="298" y1="102" x2="307" y2="93" />
      <!-- 60 Deg -->
      <line x1="265" y1="77" x2="272" y2="66" />
      <!-- 90 Deg (Center Primary) -->
      <line x1="200" y1="52" x2="200" y2="68" stroke-width="4" stroke="#0F172A" />
      <!-- 120 Deg -->
      <line x1="135" y1="77" x2="128" y2="66" />
      <!-- 135 Deg -->
      <line x1="102" y1="102" x2="93" y2="93" />
      <!-- 150 Deg -->
      <line x1="77" y1="135" x2="66" y2="130" />
    </g>

    <!-- Center Degree Text -->
    <text x="200" y="86" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14">90°</text>

    <!-- Solid Filled Angle Wedge (60 deg angle) -->
    <path 
      d="M 200 200 
         L 280 200 
         A 80 80 0 0 0 240 130.7 
         Z" 
      fill="#F97316" 
      fill-opacity="0.25"
      stroke="#F97316"
      stroke-width="1.5"
    />

    <!-- Solid Blue Measurement Arm -->
    <g filter="url(#handle-shadow)">
      <line x1="200" y1="200" x2="265" y2="87" stroke="#2563EB" stroke-width="9" stroke-linecap="round" />
      <!-- Blue Arm Handle Node -->
      <circle cx="245" cy="122" r="10" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <!-- Baseline Ray -->
    <line x1="200" y1="200" x2="285" y2="200" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />

    <!-- Green Endpoint Handle (0 deg) -->
    <circle cx="285" cy="200" r="11" fill="#10B981" stroke="#FFFFFF" stroke-width="3" filter="url(#handle-shadow)" />

    <!-- Orange Central Vertex Handle -->
    <circle cx="200" cy="200" r="18" fill="#F97316" stroke="#FFFFFF" stroke-width="4" filter="url(#handle-shadow)" />
  </g>
</svg>
