<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow for Tactile Feel -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <filter id="handle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Solid Protractor Body -->
    <path 
      d="M 50 200 
         A 150 150 0 0 1 350 200 
         L 280 200 
         A 80 80 0 0 0 120 200 
         Z" 
      fill="#E2E8F0" 
      stroke="#CBD5E1" 
      stroke-width="3" 
      filter="url(#card-shadow)" 
    />

    <!-- Tick Marks -->
    <g stroke="#64748B" stroke-width="2.5" stroke-linecap="round">
      <!-- 0 / 180 Deg -->
      <line x1="60" y1="200" x2="72" y2="200" />
      <line x1="328" y1="200" x2="340" y2="200" />
      <!-- 30 Deg -->
      <line x1="323" y1="135" x2="334" y2="130" />
      <!-- 45 Deg -->
      <line x1="298" y1="102" x2="307" y2="93" />
      <!-- 60 Deg -->
      <line x1="265" y1="77" x2="271" y2="67" />
      <!-- 90 Deg (Center Primary) -->
      <line x1="200" y1="52" x2="200" y2="66" stroke-width="3.5" stroke="#334155" />
      <!-- 120 Deg -->
      <line x1="135" y1="77" x2="129" y2="67" />
      <!-- 135 Deg -->
      <line x1="102" y1="102" x2="93" y2="93" />
      <!-- 150 Deg -->
      <line x1="77" y1="135" x2="66" y2="130" />
    </g>

    <!-- Center Degree Text -->
    <text x="200" y="86" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13">90°</text>

    <!-- Solid Filled Angle Wedge (60 deg angle) -->
    <path 
      d="M 200 200 
         L 280 200 
         A 80 80 0 0 0 240 130.7 
         Z" 
      fill="#F97316" 
      opacity="0.9"
    />

    <!-- Solid Blue Measurement Arm -->
    <g filter="url(#handle-shadow)">
      <line x1="200" y1="200" x2="265" y2="87" stroke="#2563EB" stroke-width="12" stroke-linecap="round" />
      <!-- Blue Arm Handle Node -->
      <circle cx="245" cy="122" r="10" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <!-- Baseline Ray -->
    <line x1="200" y1="200" x2="285" y2="200" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- Green Endpoint Handle (0 deg) -->
    <circle cx="285" cy="200" r="11" fill="#10B981" stroke="#FFFFFF" stroke-width="3" filter="url(#handle-shadow)" />

    <!-- Orange Central Vertex Handle -->
    <circle cx="200" cy="200" r="22" fill="#F97316" stroke="#FFFFFF" stroke-width="4.5" filter="url(#handle-shadow)" />
  </g>
</svg>
